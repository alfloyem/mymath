services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: mymath
      POSTGRES_DB: mymath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymath -d mymath"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
