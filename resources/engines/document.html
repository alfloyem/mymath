const $=id=>document.getElementById(id),J=JSON.stringify;
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>String(s??'').split(/(\$[^$]+\$)/).map(t=>/^\$[^$]+\$$/.test(t)?'\\('+esc(t.slice(1,-1))+'\\)':esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\/\/(.+?)\/\//g,'<i>$1</i>')).join('');
const escAttr=s=>esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const editorInl=s=>String(s??'').split(/(\$[^$]+\$)/).map(t=>/^\$[^$]+\$/.test(t)?`<span class="math-edit" contenteditable="false" data-tex="${escAttr(t.slice(1,-1))}">\\(${esc(t.slice(1,-1))}\\)</span>`:esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\/\/(.+?)\/\//g,'<i>$1</i>')).join('');
const num=(v,d)=>(v!==undefined&&v!==null&&v!==''&&Number.isFinite(+v))?+v:d;

/* ===== Şəkil mini-dili (SVG, y yuxarı) ===== */
function fx(src){src=String(src);if(!/^[\w+\-*\/^().\s]+$/.test(src))return null;const ok=['x','sqrt','abs','sin','cos','tan','exp','ln','pi'];if((src.match(/[a-z_]+/gi)||[]).some(w=>!ok.includes(w)))return null;try{return new Function('x','return '+src.replace(/\^/g,'**').replace(/\b(sqrt|abs|sin|cos|tan|exp)\b/g,'Math.$1').replace(/\bln\b/g,'Math.log').replace(/\bpi\b/g,'Math.PI'))}catch(e){return null}}
function fig(b){
 const w=num(b.w,200),h=num(b.h,120),pd=14,R=Math.PI/180,Y=y=>+(h-y).toFixed(2),pt=(x,y,r,a)=>[x+r*Math.cos(a*R),y+r*Math.sin(a*R)];
 const d=(p)=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(2)+' '+Y(q[1])).join('');
 const[ox,oy,kk]=Array.isArray(b.o)?b.o.map(Number):[0,0,1];
 let s='';
 for(const [fi,[k,...a]] of (b.items||[]).entries()){
  const before=s.length;
  if(k=='line')s+=`<path d="${d([[a[0],a[1]],[a[2],a[3]]])}"/>`;
  else if(k=='poly')s+=`<path d="${d(a[0])}${a[1]?'Z':''}"/>`;
  else if(k=='circle')s+=`<circle cx="${a[0]}" cy="${Y(a[1])}" r="${a[2]}"/>`;
  else if(k=='arc'){const[cx,cy,r,a1,a2]=a,p=pt(cx,cy,r,a1),q=pt(cx,cy,r,a2);s+=`<path d="M${p[0].toFixed(2)} ${Y(p[1])}A${r} ${r} 0 ${((a2-a1)%360+360)%360>180?1:0} 0 ${q[0].toFixed(2)} ${Y(q[1])}"/>`}
  else if(k=='right'){const[x,y,an,z=10]=a;s+=`<path d="${d([[x,y],pt(x,y,z,an),pt(x,y,z*1.4142,an+45),pt(x,y,z,an+90)])}Z"/>`}
  else if(k=='axes'){const[x1,x2,y1,y2]=a,X=x=>ox+kk*x,V=y=>oy+kk*y;s+=`<path d="${d([[X(x1),oy],[X(x2),oy]])}${d([[ox,V(y1)],[ox,V(y2)]])}"/>`;[[X(x2),oy,1],[ox,V(y2),0]].forEach(([x,y,hz])=>{s+=`<path d="${d(hz?[[x,y],[x-7,y+3],[x-7,y-3]]:[[x,y],[x-3,y-7],[x+3,y-7]])}Z" fill="#111"/>`})}
  else if(k=='plot'){const f=fx(a[0]);if(f){let q='',on=0;for(let i=0;i<=160;i++){const x=a[1]+(a[2]-a[1])*i/160,y=f(x),py=oy+kk*y;if(Number.isFinite(y)&&py>-pd&&py<h+pd){q+=(on?'L':'M')+(ox+kk*x).toFixed(2)+' '+Y(py);on=1}else on=0}s+=`<path d="${q}"/>`}}
  else if(k=='text')s+=`<text x="${a[0]}" y="${Y(a[1])+4}" text-anchor="middle" stroke="none" fill="#111">${esc(a[2])}</text>`;
  else if(k=='pt')s+=`<circle cx="${a[0]}" cy="${Y(a[1])}" r="2" fill="#111"/><text x="${a[0]-8}" y="${Y(a[1])+14}" text-anchor="middle" stroke="none" fill="#111">${esc(a[2])}</text>`;
  if(s.length>before)s=s.slice(0,before)+`<g data-fi="${fi}" style="cursor:grab">${s.slice(before)}</g>`;
 }
 return `<div class="fig"><svg width="${w+2*pd}" height="${h+2*pd}" viewBox="${-pd} ${-pd} ${w+2*pd} ${h+2*pd}" style="overflow:visible"><g fill="none" stroke="#111" stroke-width="1.2" font-size="12" font-style="italic" font-family="Arial,sans-serif">${s}</g></svg></div>`;
}

/* ===== Blok tipləri ===== */
const T={
 h:b=>`<h2 class="h${b.l==2?2:1}">${inl(b.t)}</h2>`,
 p:b=>`<p>${inl(b.t)}</p>`,
 note:b=>`<p><span class="r">${esc(b.m||'*')}</span> ${inl(b.t)}</p>`,
 ps:b=>`<p><span class="r">P.S${b.n?' '+esc(b.n)+')':'.'}</span> ${inl(b.t)}</p>`,
 eq:b=>`<div class="eq">\\[${esc(b.t)}\\]</div>`,
 list:b=>{const tg=b.n?'ol':'ul';return `<${tg} class="ls">${(b.items||[]).map(i=>`<li>${inl(i)}</li>`).join('')}</${tg}>`},
 gap:b=>`<div style="height:${num(b.h,12)}px"></div>`,
 fig:b=>fig(b),
 row:(b,c)=>`<div class="row">${(b.items||[]).map((x,i)=>`<div style="flex:${num((b.w||[])[i],1)}">${(T[x.type]||(()=>''))(x,c)}</div>`).join('')}</div>`,
 q:(b,c)=>{
  if(b.start!=null)c.n=num(b.start,c.n);
  const n=c.n++,has=Array.isArray(b.o)&&b.o.length;
  const o=has?`<div class="opts${b.oc?'':' auto'}"${b.oc?` style="grid-template-columns:repeat(${num(b.oc,2)},1fr)"`:''}>${b.o.slice(0,5).map((x,i)=>`<span><b>${esc(c.L[i]||'ABCDE'[i])})</b> ${inl(x)}</span>`).join('')}</div>`:'';
  return `<div class="q"><p class="qt"><b class="qn">${n}.</b> ${inl(b.t)}</p>${b.fig?fig(b.fig):''}${o}<div style="height:${num(b.space,c.sp)}px"></div></div>`;
 }
};

/* ===== Səhifələmə: bloklar sütunlara, sütunlar səhifələrə ===== */
function pack(items,cols,cap,first,warn){
 const pages=[];let pg,ci,used,cap0;
 const np=()=>{pg=Array.from({length:cols},()=>[]);pages.push(pg);ci=0;used=0;cap0=pages.length==1?cap-first:cap};
 const nc=()=>{ci++;used=0;if(ci>=cols)np()};
 np();
 items.forEach((it,i)=>{
  if(it.pb){if(pg.some(c=>c.length))np();return}
  const nx=items[i+1]&&!items[i+1].pb?items[i+1].h:0;
  if(used&&used+it.h-(it.tr||0)+(it.keep?nx:0)>cap0)nc();
  if(it.h-(it.tr||0)>cap0)warn.push(`blok ${it.i+1} səhifədən hündürdür`);
  pg[ci].push(it);used+=it.h;
 });
 return pages;
}

function validate(d){
 if(!d||typeof d!=='object')throw new Error('sənəd obyekt olmalıdır');
 if(!Array.isArray(d.blocks))throw new Error("'blocks' massiv olmalıdır");
 d.blocks.forEach((b,i)=>{if(!b||typeof b!=='object')throw new Error(`blok ${i+1} obyekt olmalıdır`)});
}

let rid=0;
let formattedNeedsTypeset=true;
async function render(d){
 validate(d);const id=++rid,msgs=[];
 const exam=d.mode=='imtahan',G=GEO[exam?'imtahan':'qayda'],cols=Math.max(1,num(d.cols,exam?2:1)),colW=(P.w-2*G.mx-G.gap*(cols-1))/cols,fs=num(d.fs,G.fs);
 const root=document.documentElement;
 root.style.setProperty('--scale',1);
 document.title=String(d.title||'Sənəd');
 const M=$('m');M.style.width=colW+'px';M.style.fontSize=fs+'px';M.style.setProperty('--lh',G.lh);M.innerHTML='';
 const ctx={n:num(d.startAt,1),cols,sp:num(d.space,exam?57:60),L:String(d.letters||'ABCDE')};
 const items=[];
 d.blocks.forEach((b,i)=>{
  if(b.type=='pb'){items.push({pb:true});return}
  const f=T[b.type];if(!f){msgs.push(`blok ${i+1}: naməlum tip "${b.type}"`);return}
  const w=el('div','blk');w.innerHTML=f(b,ctx);M.append(w);
  w.dataset.blockIndex=i;items.push({el:w,i,keep:b.type=='h'});
 });
 await mjReady;
 if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.startup.promise;await MathJax.typesetPromise([M]);if(formattedNeedsTypeset){await MathJax.typesetPromise([$ ('formatted')]);formattedNeedsTypeset=false}}catch(e){msgs.push('MathJax: '+e.message)}}
 else msgs.push('MathJax yüklənmədi (internet lazımdır) — düsturlar mətn kimi görünür');
 if(id!=rid)return;
 /* Variantların sütun sayı: ən geniş variantın real enindən avtomatik (5 → 3 → 2 → 1) */
 M.querySelectorAll('.opts.auto').forEach(o=>{
  const k=o.children.length,mx=Math.max(...[...o.children].map(x=>x.getBoundingClientRect().width)),av=colW-10;
  const c=[5,3,2,1].map(x=>Math.min(x,k)).find(x=>(mx+14)*x<=av)||1;
  o.classList.remove('auto');o.style.cssText=`display:grid;grid-template-columns:repeat(${c},1fr)`;
 });
 const first=d.title?(exam?30:(d.info?50:34)):0,pc=num(d.perCol,0),slot=pc?Math.floor((G.cap-first)/pc):0;
 items.forEach(it=>{if(it.el){it.h=it.el.offsetHeight;const sp=it.el.querySelector('.q>div:last-child');it.tr=(sp?sp.offsetHeight:0)+9;if(slot&&d.blocks[it.i].type=='q'&&it.h<slot){it.h=slot;it.el.style.minHeight=slot+'px'}}});
 const pages=pack(items,cols,G.cap,first,msgs),host=$('pages');host.innerHTML='';
 pages.forEach((pg,pi)=>{
  const pe=el('div','page'+(exam?' ex':''));pe.style.fontSize=fs+'px';pe.style.setProperty('--lh',G.lh);
  if(pi==0&&d.title){const h=el('h1');h.textContent=d.title;pe.append(h);if(d.info){const f=el('div','info');f.textContent=d.info;pe.append(f)}}
  if(d.watermark){const w=el('div','wm');w.textContent=d.watermark;pe.append(w)}
  const cs=el('div','cols'+(cols>1?' two':''));cs.style.cssText+=`;left:${G.mx}px;right:${G.mx}px;gap:${G.gap}px;top:${G.mt+(pi==0?first:0)}px;height:${G.cap-(pi==0?first:0)}px`;
  pg.forEach(c=>{const col=el('div','col');c.forEach(it=>col.append(it.el));cs.append(col)});
  const pn=el('div','pn');pn.textContent=`${pi+1} / ${pages.length}`;
  pe.append(cs,pn);host.append(pe);
 });
 msgs.length&&console.warn(msgs);
 $('status').style.color=msgs.length?'#b00':'#070';
document.querySelectorAll('#pages .blk').forEach(node=>node.onclick=()=>selectBlock(+node.dataset.blockIndex,true));
 $('pages').querySelectorAll('.fig svg [data-fi]').forEach(g=>{const owner=g.closest('.blk'),bi=+owner?.dataset.blockIndex,figureIndex=owner?[...owner.querySelectorAll('.fig svg')].indexOf(g.closest('svg')):-1,figures=Number.isInteger(bi)?figuresInBlock(d.blocks[bi]):[],figure=figures[figureIndex];if(!Number.isInteger(bi)||!figure)return;g.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();selectBlock(bi,false);g.setPointerCapture(e.pointerId);const scale=(g.closest('.page').getBoundingClientRect().width/P.w)||1,startX=e.clientX,startY=e.clientY;let dx=0,dy=0;g.style.cursor='grabbing';g.onpointermove=ev=>{dx=(ev.clientX-startX)/scale;dy=(ev.clientY-startY)/scale;g.setAttribute('transform',`translate(${dx} ${dy})`)};g.onpointerup=()=>{g.onpointermove=null;g.onpointerup=null;g.removeAttribute('transform');g.style.cursor='grab';moveFigureItem(figure.items[+g.dataset.fi],dx,-dy);queueRender()}}});
 $('status').textContent=msgs.length?msgs.join(' · '):`${pages.length} səhifə · ${items.filter(x=>x.el).length} blok`;
 fit();
}
function fit(){const w=document.documentElement.clientWidth||innerWidth;document.documentElement.style.setProperty('--scale',Math.min(1,(w-16)/P.w))}

/* ===== Redaktor ===== */
const pretty=d=>JSON.stringify(d,null,2);
const KEY=m=>'omr3-'+m;
function load(m){try{const s=localStorage.getItem(KEY(m));if(s){const d=JSON.parse(s);validate(d);return d}}catch(e){}return DEF[m]}
let mode='qayda',doc=load(mode);
let editMode='formatted',dragIndex=null;
function textField(b){if(b.type==='p'||b.type==='h'||b.type==='eq'||b.type==='note'||b.type==='ps'||b.type==='q')return b.t||'';if(b.type==='list')return (b.items||[]).join('\n');return ''}
function moveFigureItem(item,dx,dy){if(!item||!Number.isFinite(dx+dy))return;const k=item[0],r=Math.round; if(k==='line'){for(const i of [1,3])item[i]=r(item[i]+dx);for(const i of [2,4])item[i]=r(item[i]+dy)}else if(k==='poly'){item[1]=item[1].map(([x,y])=>[r(x+dx),r(y+dy)])}else if(['arc','circle','right','text','pt'].includes(k)){item[1]=r(item[1]+dx);item[2]=r(item[2]+dy)}}
function figuresInBlock(b){const out=[];if(b?.type==='fig')out.push(b);if(b?.fig?.type==='fig')out.push(b.fig);for(const child of b?.items||[])if(child&&typeof child==='object'&&!Array.isArray(child))out.push(...figuresInBlock(child));return out}
function buildFormatted(d){const host=$('formatted');if(window.MathJax?.typesetClear)try{MathJax.typesetClear([host])}catch{}host.innerHTML='';formattedNeedsTypeset=true;(d.blocks||[]).forEach((b,i)=>{const card=el('article','block-card');card.draggable=true;card.dataset.index=i;const kind=el('div','kind');kind.textContent=({p:'Mətn',h:'Başlıq',eq:'Düstur',list:'Siyahı',fig:'Şəkil',row:'Sətir',pb:'Yeni səhifə',gap:'Boşluq',note:'Qeyd',ps:'Qeyd',q:'Sual'})[b.type]||b.type;card.append(kind);const value=el('div');value.contentEditable=!['fig','row','pb','gap'].includes(b.type);value.spellcheck=false;
 if(b.type==='list'){value.className='formatted-list';value.innerHTML=(b.items||[]).map(x=>`<div>${editorInl(x)}</div>`).join('')}else if(value.contentEditable==='true')value.innerHTML=editorInl(textField(b));else value.className='meta',value.textContent=b.type==='fig'?`Şəkil · ${b.w||200} × ${b.h||120}px · ${b.items?.length||0} element · PDF-də xəttə/nöqtəyə sürüşdür`:`${b.type==='row'?'Yan-yana düzülmüş bloklar':b.type==='pb'?'Yeni səhifə':`Boşluq: ${b.h||12}px`}`;
 if(b.type==='fig'){const size=el('div','fig-size');for(const [key,label] of [['w','En'],['h','Hündürlük']]){const wrap=el('label','meta');wrap.textContent=label+' ';const input=document.createElement('input');input.type='number';input.min='40';input.max='600';input.value=b[key]|| (key==='w'?200:120);input.style.cssText='width:74px;padding:5px;border:1px solid #d9deea;border-radius:7px';input.oninput=()=>{b[key]=Math.max(40,Math.min(600,+input.value||40));doc=d;queueRender()};wrap.append(input);size.append(wrap)}card.append(size)}
 value.dataset.field='text';card.append(value);card.onclick=()=>selectBlock(i,false);card.ondragstart=()=>{dragIndex=i;card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();const to=+card.dataset.index;if(dragIndex===null||dragIndex===to)return;const moved=doc.blocks.splice(dragIndex,1)[0];doc.blocks.splice(to,0,moved);syncFromFormatted()};value.oninput=()=>{if(b.type==='list')b.items=[...value.children].map(x=>htmlToSource(x).trim());else b.t=htmlToSource(value);doc=d;queueRender()};value.ondblclick=e=>{const span=e.target.closest('.math-edit');if(!span)return;const input=document.createElement('input');input.value=span.dataset.tex;input.style.cssText='width:min(100%,360px);padding:5px;border:1px solid #e8453c;border-radius:6px';span.replaceWith(input);input.focus();const finish=()=>{const tex=input.value,math=document.createElement('span');math.className='math-edit';math.contentEditable='false';math.dataset.tex=tex;math.innerHTML=`\\(${esc(tex)}\\)`;input.replaceWith(math);if(window.MathJax?.typesetPromise)MathJax.typesetPromise([math]).catch(()=>{});if(b.type==='list')b.items=[...value.children].map(x=>htmlToSource(x).trim());else b.t=htmlToSource(value);doc=d;queueRender()};input.onblur=finish;input.onkeydown=e=>{if(e.key==='Enter')input.blur()}};host.append(card)});$('src').value=pretty(d)}
function htmlToSource(node){const walk=n=>{if(n.nodeType===3)return n.nodeValue||'';if(n.nodeType===1&&n.matches('.math-edit'))return `$${n.dataset.tex||''}$`;if(n.nodeName==='BR')return '\n';const inner=[...n.childNodes].map(walk).join('');if(n.nodeName==='B'||n.nodeName==='STRONG')return `**${inner}**`;if(n.nodeName==='I'||n.nodeName==='EM')return `//${inner}//`;if(n.nodeName==='DIV'||n.nodeName==='P')return inner+'\n';return inner};return [...node.childNodes].map(walk).join('').replace(/\n$/,'')}
function selectBlock(i,scroll){document.querySelectorAll('.block-card,.page .blk').forEach(x=>x.classList.toggle('selected',+x.dataset.index===i||+x.dataset.blockIndex===i));const card=document.querySelector(`.block-card[data-index="${i}"]`);if(card&&scroll)card.scrollIntoView({block:'nearest',behavior:'smooth'});if(card&&scroll){const f=card.querySelector('[contenteditable="true"]');if(f)f.focus()}}
function syncFromFormatted(){buildFormatted(doc);$('src').value=pretty(doc);queueRender()}
let renderTimer;function queueRender(){clearTimeout(renderTimer);renderTimer=setTimeout(async()=>{try{await render(doc);localStorage.setItem(KEY(mode),J(doc))}catch(e){$('status').textContent='Xəta: '+e.message}},350)}
async function show(d){doc=d;$('src').value=pretty(d);buildFormatted(d);try{await render(d)}catch(e){$('status').textContent='Xəta: '+e.message}}
async function apply(){
 let d;
 try{d=JSON.parse($('src').value.replace(/^\uFEFF/,''))}catch(e){$('status').style.color='#b00';$('status').textContent='JSON sintaksis xətası: '+e.message;return}
 try{validate(d);await render(d)}catch(e){$('status').style.color='#b00';$('status').textContent='Struktur xətası: '+e.message;return}
 doc=d;if(d.mode&&DEF[d.mode]){mode=d.mode;$('mode').value=mode}
 try{localStorage.setItem(KEY(mode),J(doc))}catch(e){}
 if(editMode==='formatted')buildFormatted(doc);return true
}
$('apply').onclick=apply;
$('rawMode').onclick=()=>{editMode='raw';$('src').style.display='block';$('formatted').style.display='none';$('rawMode').classList.add('primary');$('formattedMode').classList.remove('primary')};
$('formattedMode').onclick=async()=>{if(editMode==='raw'&&!await apply())return;editMode='formatted';$('src').style.display='none';$('formatted').style.display='block';$('rawMode').classList.remove('primary');$('formattedMode').classList.add('primary');buildFormatted(doc)};
$('bold').onmousedown=$('italic').onmousedown=e=>e.preventDefault();$('bold').onclick=()=>document.execCommand('bold');$('italic').onclick=()=>document.execCommand('italic');
$('src').addEventListener('input',()=>{try{const d=JSON.parse($('src').value);validate(d);doc=d;queueRender()}catch(e){$('status').textContent='JSON tamamlananda tətbiq ediləcək'}});
$('print').onclick=()=>{document.documentElement.style.setProperty('--scale',1);print();fit()};
$('reset').onclick=()=>{try{localStorage.removeItem(KEY(mode))}catch(e){}doc=DEF[mode];show(doc)};
$('mode').onchange=e=>{mode=e.target.value;doc=load(mode);show(doc)};
addEventListener('resize',fit);
addEventListener('beforeprint',()=>document.documentElement.style.setProperty('--scale',1));
addEventListener('afterprint',fit);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='b'&&document.activeElement.closest('#formatted')){e.preventDefault();document.execCommand('bold')}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();apply()}});
show(doc);
</script>
</body>
