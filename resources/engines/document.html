function beginPen(e,page,d){e.preventDefault();recordUndo();const scale=page.getBoundingClientRect().width/P.w,rect=page.getBoundingClientRect(),points=[[Math.round((e.clientX-rect.left)/scale),Math.round((e.clientY-rect.top)/scale)]],svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),path=document.createElementNS('http://www.w3.org/2000/svg','path');svg.setAttribute('viewBox',`0 0 ${P.w} ${P.h}`);svg.classList.add('pen-overlay');path.setAttribute('fill','none');path.setAttribute('stroke','#243047');path.setAttribute('stroke-width','2.2');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');svg.append(path);page.append(svg);page.setPointerCapture(e.pointerId);const update=ev=>{if(points.length>=280)return;points.push([Math.round((ev.clientX-rect.left)/scale),Math.round((ev.clientY-rect.top)/scale)]);path.setAttribute('d',points.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' '))};page.onpointermove=update;page.onpointerup=()=>{page.onpointermove=null;page.onpointerup=null;svg.remove();if(points.length>1){const items=[];for(let i=1;i<points.length;i++)items.push(['line',points[i-1][0]-14,P.h-points[i-1][1]+14,points[i][0]-14,P.h-points[i][1]+14]);const b={type:'fig',w:P.w,h:P.h,x:0,y:0,page:+page.dataset.page||0,width:P.w,penLayer:true,items};doc.blocks.push(b);selectedIndex=doc.blocks.length-1;dirty=true;penMode=false;document.querySelector('[data-add="pen"]').classList.remove('active');queueRender()}}}
function insertBlock(type){if(type==='pen'){penMode=!penMode;document.querySelector('[data-add="pen"]').classList.toggle('active',penMode);$('status').textContent=penMode?'Qələm aktivdir · səhifədə sürüşdürərək çək':'Qələm söndürüldü';return}recordUndo();let block;if(type==='h1'||type==='h2')block={type:'h',l:type==='h1'?1:2,t:'Başlıq'};else if(type==='fig')block={type:'fig',w:180,h:130,items:[['poly',[[15,15],[165,15],[90,115]],true],['text',90,55,'Şəkil']]};else if(type==='row')block={type:'row',items:[{type:'p',t:'Sol məzmun'},{type:'p',t:'Sağ məzmun'}]};else if(type==='stamp')block={type:'stamp',t:'Künc qeydi'};else if(type==='eq')block={type:'eq',t:'x^2+y^2=z^2'};else if(type==='note')block={type:'note',t:'Qeyd'};else block={type:'p',t:'Mətn yazın'};const prev=doc.blocks[selectedIndex],width=Math.min(P.w,canvasWidth(block));block.x=prev?Math.min(P.w-width,snap(prev.x,50)+28):Math.min(60,P.w-width);block.y=prev?Math.min(P.h-80,snap(prev.y,100)+42):120;block.page=Math.min(49,activePage);block.width=width;doc.blocks.splice(Math.max(0,selectedIndex+1),0,block);selectedIndex=Math.max(0,selectedIndex+1);doc.pageCount=Math.min(50,Math.max(doc.pageCount||1,block.page+1));markDirty();show(doc).then(()=>{const target=document.querySelector(`.canvas-item[data-block-index="${selectedIndex}"] [contenteditable="true"]`);target?.focus();saveDocument()})}

function htmlToSource(node){const walk=n=>{if(n.nodeType===3)return n.nodeValue||'';if(n.nodeType===1&&n.matches('.math-source'))return `$${n.dataset.tex||''}$`;if(n.nodeName==='BR')return '\n';const inner=[...n.childNodes].map(walk).join('');if(n.nodeName==='B'||n.nodeName==='STRONG')return `**${inner}**`;if(n.nodeName==='I'||n.nodeName==='EM')return `//${inner}//`;if(n.nodeName==='SUP')return `^{${inner}}`;if(n.nodeName==='SUB')return `_{${inner}}`;if(n.nodeName==='DIV'||n.nodeName==='P')return inner+'\n';return inner};return [...node.childNodes].map(walk).join('').replace(/\n$/,'')}
let renderTimer;function queueRender(){clearTimeout(renderTimer);renderTimer=setTimeout(async()=>{try{await render(doc);saveDocument()}catch(e){$('status').textContent='Xəta: '+e.message}},250)}
